x solid #cfdaeb;padding:13px;border-radius:11px;width:100%}textarea{min-height:140px;resize:vertical}.fieldlabel{font-size:13px;color:var(--muted);display:block;margin:12px 0 6px}.actionrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.check{display:flex;align-items:center;gap:9px;line-height:1.8}input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue)}.qresult{margin-top:13px;padding:13px;border-radius:10px;background:#f3f8ff}.footer-nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.menu-btn{display:none}.hide{display:none!important}@media(max-width:960px){.layout{grid-template-columns:1fr}.side{position:fixed;z-index:40;width:300px;transform:translateX(-102%);transition:.2s;box-shadow:8px 0 30px #1d3d6c22}.side.open{transform:none}.menu-btn{display:inline-block}.main{padding:19px 16px 60px}.two{grid-template-columns:1fr}.hero{padding:25px}.statrow{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}}@media(max-width:480px){.statrow{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}.top{align-items:flex-start}.hero h1{font-size:28px}}@media print{.side,.top,.tabs,.actionrow,.footer-nav,.menu-btn{display:none!important}.layout{display:block}.main{padding:0}.panel{break-inside:avoid}}

<script>const DATA={"modules": [{"title": "Finance for CMO", "description": "อ่านตัวเลขธุรกิจ ต้นทุน กำไร และตัดสินใจลงทุน"}, {"title": "Revenue Forecast & Business Case", "description": "คาดการณ์รายได้แบบตรวจสอบสมมติฐานได้"}, {"title": "Corporate Growth Strategy", "description": "เลือกว่าจะเติบโตที่ไหนและชนะอย่างไร"}, {"title": "Market & Customer Intelligence", "description": "ใช้เสียงลูกค้าและข้อมูลตลาดสร้างการตัดสินใจ"}, {"title": "Marketing Organization & Leadership", "description": "พัฒนาทีมให้ทำงานได้โดยไม่พึ่งตัวเรา"}, {"title": "Executive Leadership Capstone", "description": "แปลงกลยุทธ์เป็นทางเลือกให้ CEO/Board ตัดสินใจ"}], "lessons": [{"id": 1, "module": 1, "week": 1, "title": "P&L Fundamentals", "concept": "Revenue, COGS, Gross Profit, Gross Margin", "outcome": "อ่านงบกำไรขาดทุนและแยกยอดขายออกจากกำไร", "assignment": "ทำตาราง P&L 1 เดือนสำหรับเครื่องพิมพ์ 3 กลุ่ม", "question": "ยอดขาย 1,200,000 ต้นทุนสินค้า 840,000 กำไรขั้นต้นและอัตรากำไรขั้นต้นคือเท่าไร?", "answer": 360000, "unit": "บาท", "deepDive": "งบ P&L เริ่มจากรายได้ที่รับรู้ ไม่ใช่มูลค่า Lead หรือยอดจองที่ยังไม่เข้าเกณฑ์รับรู้รายได้ COGS ครอบคลุมต้นทุนสินค้า/บริการที่ขาย จากนั้นคำนวณกำไรขั้นต้นก่อนพิจารณา OPEX", "appliedExample": "แยกยอดขายตาม UV, DTF, วัสดุสิ้นเปลือง แล้วถาม Finance ว่าราคาที่แสดงรวม VAT หรือไม่ ต้นทุนส่วนใดถือเป็น COGS และช่วงเวลารับรู้รายได้ตรงกับรายงาน Marketing หรือไม่"}, {"id": 2, "module": 1, "week": 2, "title": "Profit & Cost Structure", "concept": "Operating Profit, EBITDA, Fixed vs Variable Cost", "outcome": "วิเคราะห์ผลของต้นทุนคงที่และผันแปรต่อกำไร", "assignment": "ทำ Cost Map: ค่าโฆษณา ค่าเช่า เงินเดือน ติดตั้ง ขนส่ง", "question": "รายได้ 900,000 ต้นทุนขาย 600,000 ค่าใช้จ่ายดำเนินงาน 200,000 กำไรจากการดำเนินงานเท่าไร?", "answer": 100000, "unit": "บาท", "deepDive": "กำไรขั้นต้นยังไม่หักเงินเดือน ค่าเช่า ระบบ และต้นทุนดำเนินงานทั้งหมด EBITDA ไม่เท่ากับ Cash Flow; กำไรทางบัญชีอาจเกิดโดยยังไม่ได้รับเงินสด", "appliedExample": "สมมติยอดขายเติบโต 20% แต่ค่าใช้จ่ายคงที่เพิ่ม 40% ให้คำนวณ Operating Profit ทั้งสองช่วงแล้วอธิบายว่าการขยายธุรกิจคุ้มค่าหรือไม่"}, {"id": 3, "module": 1, "week": 3, "title": "Marketing Unit Economics", "concept": "CAC, LTV, Contribution Margin, Payback", "outcome": "หาต้นทุนหาลูกค้าใหม่และมูลค่าที่ลูกค้าสร้าง", "assignment": "ทำตาราง CAC by Channel และ Contribution after Acquisition", "question": "ค่าใช้จ่ายหาลูกค้า 120,000 ได้ลูกค้าใหม่ 12 ราย CAC เท่าไร?", "answer": 10000, "unit": "บาท/ลูกค้า", "deepDive": "CAC ควรใช้ต้นทุน Acquisition ที่เกี่ยวข้องอย่างสม่ำเสมอ รวม Marketing และ Sales ตามนิยามที่ตกลง LTV ต้องอิงกำไร/Contribution ตลอดอายุลูกค้า ไม่ใช่ยอดขายรวมเฉย ๆ", "appliedExample": "เปรียบเทียบลูกค้าซื้อเครื่องครั้งเดียวกับลูกค้าที่ซื้อเครื่องและวัสดุต่อเนื่อง ระบุค่าใช้จ่ายดูแลหลังขายและช่วงเวลาที่ใช้วัด LTV"}, {"id": 4, "module": 1, "week": 4, "title": "Budget & Profitability", "concept": "Break-even, Budget Variance, Incrementality", "outcome": "ตัดสินใจจัดสรรงบโดยเน้นกำไร ไม่ใช่ยอด Lead อย่างเดียว", "assignment": "ทำ Memo: เพิ่ม/ลด/คงงบ 3 ช่องทางพร้อมเหตุผล", "question": "งบ 150,000 ใช้จริง 165,000 เกินงบกี่บาท?", "answer": 15000, "unit": "บาท", "deepDive": "Incrementality คือผลที่เกิดเพิ่มเพราะทำกิจกรรม ไม่ใช่ทุก Conversion ที่ถูก Attribution มายัง Ads วิเคราะห์ Budget Variance ทั้งส่วนต่างจำนวนเงินและสาเหตุ", "appliedExample": "เลือก 3 ช่องทางสร้าง Scorecard โดยพิจารณา Contribution, Lead Quality, Sales Cycle และความเชื่อมั่นใน Measurement"}, {"id": 5, "module": 2, "week": 5, "title": "Revenue Driver Tree", "concept": "Lead-to-Opportunity-to-Win, AOV, Sales Cycle", "outcome": "เชื่อมตัวเลข Funnel กับรายได้", "assignment": "วาด Driver Tree และระบุ Owner ของแต่ละ Conversion", "question": "Leads 400 ราย เปลี่ยนเป็นลูกค้า 5% จะได้ลูกค้ากี่ราย?", "answer": 20, "unit": "ราย", "deepDive": "Driver Tree คือสมการที่แตกผลลัพธ์ออกเป็นตัวขับ เช่น Qualified Leads, Win Rate และ AOV แต่ละตัวต้องมี Owner และความถี่วัด", "appliedExample": "แยก Funnel ของ New Business กับ Existing Customer เพราะฐาน Conversion และมูลค่าต่อดีลอาจต่างกันมาก"}, {"id": 6, "module": 2, "week": 6, "title": "Bottom-up Forecast", "concept": "Cohorts, Seasonality, Sales Capacity", "outcome": "พยากรณ์ยอดขายด้วยปริมาณและอัตราปิดจริง", "assignment": "สร้าง Forecast 12 เดือน แยก Base Assumptions", "question": "ลูกค้าคาดการณ์ 18 ราย AOV 120,000 รายได้เท่าไร?", "answer": 2160000, "unit": "บาท", "deepDive": "Bottom-up Forecast เริ่มจาก Leads/Deals ที่ตรวจสอบได้และความสามารถปิดของทีม จากนั้นปรับ Lag และ Seasonality; Top-down เป็นตัวเช็กความสมเหตุสมผล", "appliedExample": "ทำ Forecast รายเดือนที่เชื่อม Leads ของเดือนก่อนหน้าเข้ากับยอดปิดของเดือนถัดไป กำหนด Conversion Lag อย่างชัดเจน"}, {"id": 7, "module": 2, "week": 7, "title": "Scenario & Sensitivity", "concept": "Base/Upside/Downside, Leading Indicators", "outcome": "ทดสอบว่าอะไรทำให้ Forecast เปลี่ยนมากที่สุด", "assignment": "ทำ Scenario 3 ระดับด้วย Conversion และ AOV", "question": "Lead 500 ราย Conversion 4% AOV 80,000 คาดรายได้เท่าไร?", "answer": 1600000, "unit": "บาท", "deepDive": "Scenario ไม่ใช่การบวกหรือลบ 10% จากตัวเลขเดียวเสมอไป ต้องระบุ Drivers ที่เปลี่ยน เช่น CPL, Win Rate, AOV, Capacity และราคาขาย", "appliedExample": "สร้าง Data Table ว่าถ้า CPL สูงขึ้น 25% และ Win Rate ลดลง 2 จุดเปอร์เซ็นต์ รายได้ที่คาดและ CAC เปลี่ยนอย่างไร"}, {"id": 8, "module": 2, "week": 8, "title": "Investment Decision", "concept": "ROI, NPV, Payback, Hurdle Rate", "outcome": "นำเสนอการลงทุนแบบมีเกณฑ์หยุดและเงื่อนไขผ่าน", "assignment": "เขียน Investment Memo หนึ่งหน้า พร้อม Risk Register", "question": "ลงทุน 300,000 สร้าง Contribution เพิ่ม 450,000 ส่วนเกินก่อนต้นทุนอื่นคือเท่าไร?", "answer": 150000, "unit": "บาท", "deepDive": "Business Case ที่ดีเทียบสถานการณ์ลงทุนกับกรณีไม่ลงทุน รวมต้นทุนเริ่มต้น ต้นทุนต่อเนื่อง เงินทุนหมุนเวียน และความเสี่ยง NPV ใช้ Discount Rate และกระแสเงินสดตามช่วงเวลา", "appliedExample": "เตรียม One-page Memo เสนอทดสอบแคมเปญ 90 วัน ระบุ Kill Criteria เช่น Qualified CPL เกินเพดานสองรอบติด"}, {"id": 9, "module": 3, "week": 9, "title": "Strategy Diagnosis", "concept": "Growth Drivers, Strategic Trade-offs", "outcome": "วิเคราะห์ข้อจำกัดและโอกาสการเติบโต", "assignment": "ทำ Strategic Diagnosis แบบข้อเท็จจริง/สมมติฐาน", "question": "มีกลยุทธ์ 5 โครงการแต่ทีมรับได้ 2 ควรทำอะไรเป็นอันดับแรก?", "answer": 2, "unit": "โครงการ", "deepDive": "Corporate Strategy คือการเลือกพื้นที่แข่งขันและความสามารถที่จะสร้าง เพื่อให้ธุรกิจชนะอย่างยั่งยืน ไม่ใช่รวมทุกแผนกเป็น To-do List", "appliedExample": "ประเมินว่า IDO4IDEA ควรเร่ง Acquisition, Repeat Consumables หรือ Upsell เครื่องใหญ่ โดยตั้งสมมติฐานที่ต้องพิสูจน์อย่างเปิดเผย"}, {"id": 10, "module": 3, "week": 10, "title": "Market Opportunity Sizing", "concept": "TAM/SAM/SOM, Ansoff Matrix", "outcome": "ประมาณโอกาสตลาดโดยเปิดเผยสมมติฐาน", "assignment": "สร้าง Market Sizing Sheet พร้อม Source Log", "question": "ตลาดเป้าหมาย 10,000 ร้าน เข้าถึงได้ 20% เท่ากับกี่ร้าน?", "answer": 2000, "unit": "ร้าน", "deepDive": "TAM คือขนาดตลาดรวมตามนิยาม SAM คือส่วนที่บริการได้ด้วยสินค้าและข้อจำกัดจริง SOM คือส่วนที่คาดเข้าถึง/ชนะได้ในช่วงเวลาที่กำหนด", "appliedExample": "สมมติจำนวนร้านพิมพ์ในพื้นที่ ราคาใช้จ่ายเฉลี่ย และส่วนแบ่งที่เป็นไปได้ แล้วทำ Source & Confidence Log"}, {"id": 11, "module": 3, "week": 11, "title": "Competitive Advantage", "concept": "Five Forces, Differentiation, Willingness to Pay", "outcome": "วาง Positioning จากความต้องการและหลักฐาน", "assignment": "สร้าง Competitive Alternatives Matrix", "question": "คู่แข่งราคา 100,000 เราราคา 115,000 ส่วนต่างราคาเท่าไร?", "answer": 15000, "unit": "บาท", "deepDive": "ความต่างต้องมีคุณค่าสำหรับลูกค้าและพิสูจน์ได้ ราคาไม่ควรเปรียบเทียบโดยไม่รวมบริการ การรับประกัน ต้นทุนเวลาเสียและความเสี่ยง", "appliedExample": "ทำตารางเปรียบเทียบตัวเลือกของลูกค้าซื้อเครื่อง DTF โดยใช้ราคา ต้นทุนพิมพ์ คุณภาพบริการ ความน่าเชื่อถือ และหลักฐานจริง"}, {"id": 12, "module": 3, "week": 12, "title": "Strategic Bets & OKRs", "concept": "Portfolio Choices, Resource Allocation", "outcome": "เลือก 3 Growth Bets และกำหนด Leading/Lagging KPI", "assignment": "เขียน 3-Year Strategy on a Page", "question": "เป้ารายได้ 20 ล้าน โต 15% เป้าปีถัดไปเท่าไร?", "answer": 23000000, "unit": "บาท", "deepDive": "Strategic Bet คือสมมติฐานเชิงกลยุทธ์ที่ลงทรัพยากรและวัดผล ไม่ใช่ Activity; OKR ต้องมี Outcome วัดได้พร้อม Guardrails", "appliedExample": "กำหนด 3 Bets พร้อม Hypothesis, Investment, Leading KPI, Lagging KPI, Owner, Decision Gate และสิ่งที่จะเลิกทำ"}, {"id": 13, "module": 4, "week": 13, "title": "Customer Research", "concept": "JTBD, Interviews, Bias Control", "outcome": "ตั้งคำถามที่ค้นหาปัญหาจริงและเลี่ยงคำถามชี้นำ", "assignment": "ทำ Interview Guide 12 คำถามและสัมภาษณ์อย่างน้อย 5 ราย", "question": "สัมภาษณ์ลูกค้า 8 ราย พบปัญหาเดียวกัน 6 ราย คิดเป็นกี่เปอร์เซ็นต์?", "answer": 75, "unit": "%", "deepDive": "งานวิจัยเชิงคุณภาพช่วยเข้าใจเหตุผลและบริบท ไม่ได้ประมาณสัดส่วนประชากรแม่นยำโดยตัวมันเอง ควรเลี่ยงคำถามนำ เช่น คุณชอบสินค้าของเราไหม", "appliedExample": "สัมภาษณ์ลูกค้าที่ซื้อและไม่ซื้อโดยถามถึงงานที่พยายามทำ ข้อจำกัด การค้นหาทางเลือก และเกณฑ์ตัดสินใจจริง"}, {"id": 14, "module": 4, "week": 14, "title": "Segmentation & ICP", "concept": "Needs-based Segments, CLV, Buying Committee", "outcome": "สร้าง Ideal Customer Profile ที่ใช้คัดกรองจริง", "assignment": "ทำ ICP Scorecard พร้อม Negative Criteria", "question": "ลูกค้า 80 ราย เข้าเกณฑ์ ICP 20 ราย สัดส่วนคือเท่าไร?", "answer": 25, "unit": "%", "deepDive": "ICP ระบุกลุ่มที่บริษัทให้คุณค่าได้ดีที่สุดและได้ Economics ที่เหมาะ ไม่ใช่เพียงอายุ/อาชีพ ต้องมี Firmographics, Need, Urgency, Budget, Fit และ Disqualifiers", "appliedExample": "สร้าง Lead Scoring แบบง่ายสำหรับร้านพิมพ์ที่มีออเดอร์ประจำเทียบผู้เริ่มต้น และเชื่อมกับการติดตามผลที่ไม่กดดันลูกค้าผิดกลุ่ม"}, {"id": 15, "module": 4, "week": 15, "title": "Demand & Competitor Intelligence", "concept": "Signals, Share of Search, Competitor Mapping", "outcome": "ติดตามคู่แข่งโดยแยกข้อมูลยืนยันกับข้อสันนิษฐาน", "assignment": "ทำ Monthly Market Intelligence Brief", "question": "มีคู่แข่ง 12 ราย ตรวจครบ 9 ราย Coverage เป็นกี่เปอร์เซ็นต์?", "answer": 75, "unit": "%", "deepDive": "Competitive Intelligence ที่ดีเก็บ URL วันที่ หลักฐาน และ Confidence Level อย่าปะปนราคาโปรชั่วคราวกับราคาปกติ หรือคำโฆษณากับข้อเท็จจริง", "appliedExample": "ทำ Competitor Watch 5 ราย ทุกเดือนและติดตามราคา ข้อเสนอ การรับประกัน จุดขาย ช่องทาง และกิจกรรมใหม่ พร้อมคำแนะนำตอบโต้"}, {"id": 16, "module": 4, "week": 16, "title": "Retention & Expansion", "concept": "Lifecycle Marketing, Churn, Cross-sell", "outcome": "ออกแบบ Growth จากฐานลูกค้าเดิม", "assignment": "ทำ Retention Initiative พร้อม Cohort Metric", "question": "ลูกค้าต้นงวด 200 ราย คงอยู่ 170 ราย Retention Rate เท่าไร?", "answer": 85, "unit": "%", "deepDive": "Retention ขึ้นกับประสบการณ์หลังซื้อและผลลัพธ์ที่ลูกค้าได้รับ โดยเฉพาะเครื่องจักรที่ต้องสอนและบำรุงรักษา ควรแบ่ง Cohort ตามเดือนซื้อและประเภทสินค้า", "appliedExample": "สร้าง Lifecycle สำหรับลูกค้าที่เพิ่งซื้อเครื่อง: Onboarding → Training → First Success → Consumable Replenishment → Expansion"}, {"id": 17, "module": 5, "week": 17, "title": "Operating Model", "concept": "Team Topology, Roles, Span of Control", "outcome": "ออกแบบทีมตาม Value Streams ไม่ใช่แค่ช่องทาง", "assignment": "สร้าง Organization Chart พร้อม Mission ของแต่ละทีม", "question": "ทีม 16 คน มีหัวหน้า 4 คน เฉลี่ยคนต่อหัวหน้ากี่คน?", "answer": 4, "unit": "คน", "deepDive": "Operating Model กำหนดว่าจะส่งมอบคุณค่าอย่างไร ใครเป็นเจ้าของ Outcome ทีมควรออกแบบตามขนาดงานและทักษะ ไม่ใช่เลียนแบบโครงสร้างบริษัทใหญ่", "appliedExample": "สร้างแผนทีม Content, Performance, CRM, Marketing Ops และ Market Intelligence พร้อมหน้าที่ซ้ำซ้อน/ช่องว่าง"}, {"id": 18, "module": 5, "week": 18, "title": "Delegation & RACI", "concept": "Decision Rights, DACI/RACI, Escalation", "outcome": "ระบุใครตัดสินใจ ใครรับผิดชอบ ลดคอขวด", "assignment": "ทำ RACI ของ Campaign Launch และ Approval Matrix", "question": "งาน 20 งาน มอบหมายได้ 15 งาน คิดเป็นกี่เปอร์เซ็นต์?", "answer": 75, "unit": "%", "deepDive": "RACI: Responsible ทำงาน, Accountable รับผิดชอบผลสุดท้าย, Consulted ให้คำปรึกษา, Informed รับทราบ อย่ามี Accountable หลายคนในงานเดียวโดยไร้กติกา", "appliedExample": "ทำ RACI สำหรับการเปิดตัวโปรใหม่ ตั้งแต่ Approval เงื่อนไข ข้อมูลราคา Creative Ads Landing Page จนถึง Postmortem"}, {"id": 19, "module": 5, "week": 19, "title": "Performance Coaching", "concept": "OKRs, 1:1, Feedback, Talent Matrix", "outcome": "เปลี่ยนจากสั่งงานเป็นโค้ชที่วัดผลได้", "assignment": "สร้าง Team Scorecard และ 1:1 Agenda", "question": "เป้าหมายส่งงานตรงเวลา 90% จาก 40 งาน ต้องตรงเวลากี่งาน?", "answer": 36, "unit": "งาน", "deepDive": "โค้ชทีมด้วยผลลัพธ์ พฤติกรรม และตัวขัดขวาง อย่าประเมินเพียงชั่วโมงทำงาน 1:1 ควรเปิดโอกาสให้ทีมสะท้อนและขอความช่วยเหลือ", "appliedExample": "ออกแบบ 1:1 รายสัปดาห์ 30 นาทีโดยแบ่ง Progress, Blockers, Skill Development, Decision Needed และ Commitments"}, {"id": 20, "module": 5, "week": 20, "title": "Change Management", "concept": "Stakeholder Map, Adoption, Succession", "outcome": "ทำให้ระบบใหม่ถูกใช้งานจริงและมีแผนต่อเนื่อง", "assignment": "ทำ 90-Day Change & Adoption Plan", "question": "ทีม 25 คนเริ่มใช้ระบบใหม่ 20 คน Adoption Rate เท่าไร?", "answer": 80, "unit": "%", "deepDive": "การเปลี่ยนระบบล้มเหลวได้แม้ซอฟต์แวร์ดี หากไม่กำหนดผู้ใช้เป้าหมาย แรงจูงใจ วิธีฝึก อำนาจเจ้าของระบบ และ Adoption Metric", "appliedExample": "วางแผนนำ Marketing Dashboard/Command Center ไปใช้จริง พร้อม Champion, Training, Feedback Loop และ Metric การใช้งาน"}, {"id": 21, "module": 6, "week": 21, "title": "Executive Narrative", "concept": "One-page Decision Memo, Pyramid Principle", "outcome": "เล่าเรื่องจาก Decision → Evidence → Risk", "assignment": "เขียน Decision Memo 1 หน้า", "question": "แผน 12 ล้านบาท ผลตอบแทนคาด 15 ล้านบาท ส่วนต่างคือเท่าไร?", "answer": 3000000, "unit": "บาท", "deepDive": "Executive Narrative เริ่มจากคำตอบก่อน ตามด้วย 3 เหตุผลหลัก หลักฐาน และ Ask หลีกเลี่ยงสไลด์ข้อมูลยาวที่ไม่มีข้อเสนอให้เลือก", "appliedExample": "เขียน Memo หนึ่งหน้าขอปรับงบโฆษณา: ทำไมต้องเปลี่ยน ทางเลือก ผลกระทบ ความเสี่ยง และอนุมัติอะไร"}, {"id": 22, "module": 6, "week": 22, "title": "Boardroom Decision", "concept": "Options, Trade-offs, Governance", "outcome": "เปรียบเทียบทางเลือกอย่างเป็นธรรมพร้อม downside", "assignment": "ทำ Board Simulation 3 ตัวเลือก", "question": "โครงการ 4 โครงการอนุมัติ 3 โครงการ Approval Rate เท่าไร?", "answer": 75, "unit": "%", "deepDive": "การบริหาร Trade-off ต้องแสดง Opportunity Cost ของทุกทางเลือกและการไม่ทำอะไร Board มองความเสี่ยงรวม ความสอดคล้องกลยุทธ์ และทุน", "appliedExample": "จำลองการประชุมที่มี 3 โครงการแต่อนุมัติได้ 1 โครงการ สรุปเหตุผลและวิธีติดตามหลังอนุมัติ"}, {"id": 23, "module": 6, "week": 23, "title": "Integrated CMO Strategy", "concept": "Finance × Growth × Talent × MarTech", "outcome": "ประกอบกลยุทธ์ครบวงจรโดยมี KPI Tree", "assignment": "ทำ CMO Strategic Plan 12–36 เดือน", "question": "รายได้ 50 ล้าน เพิ่ม 10% เป้าหมายใหม่คือเท่าไร?", "answer": 55000000, "unit": "บาท", "deepDive": "CMO Strategy ต้องเชื่อม Positioning, Customer, Financial Model, Channel Portfolio, Capability Roadmap และ Organizational Accountability ภายใต้สมมติฐานชุดเดียว", "appliedExample": "รวบรวมงานทั้งหมดเป็น 12–36 Month Growth Plan ที่มี Baseline, Target, Budget, Owners, Milestones และ Kill/Scale Gates"}, {"id": 24, "module": 6, "week": 24, "title": "Portfolio & Mock Interview", "concept": "Evidence, STAR, Executive Presence", "outcome": "แสดงผลงานที่ตัดสินใจจริง ผลลัพธ์และบทเรียน", "assignment": "สร้าง Portfolio 3 Case Studies และซ้อมสัมภาษณ์", "question": "Portfolio ต้องมี 3 เคส เสร็จ 2 เคส ยังขาดกี่เคส?", "answer": 1, "unit": "เคส", "deepDive": "Portfolio สำหรับตำแหน่ง CMO ต้องอธิบายบริบท การตัดสินใจที่ตัวเองรับผิดชอบ บทบาทของทีม ตัวเลขก่อนหลัง ข้อจำกัด Attribution และบทเรียน", "appliedExample": "สร้าง 3 Case Studies: Financial Decision, Growth Strategy, Transformation/People Leadership พร้อมหน้า Executive Summary"}]};const LES=DATA.lessons;const MOD=DATA.modules;let state={done:{},notes:{},work:{},quiz:{}};try{const saved=JSON.parse(localStorage.getItem('cmo-academy-v1'));if(saved)state={...state,...saved}}catch(e){};let current=0,tab='lesson';const $= function lesson(){let l=LES[current-1],mod=MOD[l.module-1],d=deep(l);$('content').innerHTML=`<div class="lesson-header"><div class="eyebrow">MODULE ${String(l.module).padStart(2,'0')} · WEEK ${l.week} / 24</div><h1>${escapeHtml(l.title)}</h1><p class="lesson-desc">${escapeHtml(mod.description)} · ${escapeHtml(l.concept)}</p><span class="pill">Learning Outcome: ${escapeHtml(l.outcome)}</span></div><div class="tabs">${[['lesson','📘 บทเรียน'],['case','📊 Case Study'],['workshop','🛠 Workshop'],['quiz','✅ Quiz & Reflection']].map(([t,label])=>`<button class="tab ${tab===t?'active':''}" onclick="tab='${t}';lesson()">${label}</button>`).join('')}</div><div id="body"></div><div class="footer-nav"><button class="btn secondary" onclick="openLesson(${Math.max(1,current-1)})" ${current===1?'disabled':''}>← บทก่อนหน้า</button><button class="btn" onclick="openLesson(${Math.min(24,current+1)})" ${current===24?'disabled':''}>บทถัดไป →</button></div>`;const body=$('body');if(tab==='lesson')body.innerHTML=`<div class="two"><div class="stack"><article class="panel section"><div class="sub">01 · EXECUTIVE CONCEPT</div><h2>แนวคิดหลักที่ต้องเข้าใจ</h2><p>${escapeHtml(d[0])}</p><p>สำหรับหัวข้อ <strong>${escapeHtml(l.title)}</strong> ให้เริ่มจากการระบุปัญหาทางธุรกิจ กำหนดหน่วยวัดและเจ้าของข้อมูล ก่อนเลือกเครื่องมือหรือ Framework วิธีนี้ช่วยลดการตัดสินใจจากความรู้สึกและตรวจสอบย้อนกลับได้</p><div class="callout"><b>คำถามแบบ CMO</b><br>ถ้าต้องอนุมัติงบหรือเปลี่ยนกลยุทธ์วันนี้ หลักฐานขั้นต่ำอะไรที่จะทำให้ตัดสินใจได้อย่างมั่นใจ?</div></article><article class="panel section"><div class="sub">02 · METHODS & FRAMEWORK</div><h2>วิธีทำแบบทีละขั้น</h2><ol><li>นิยามโจทย์ธุรกิจและเป้าหมายที่ต้องการเปลี่ยน</li><li>ระบุ KPI, สูตรคำนวณ, แหล่งข้อมูล และช่วงเวลา</li><li>แยกข้อเท็จจริงออกจากสมมติฐานที่ต้องพิสูจน์</li><li>วิเคราะห์อย่างน้อยสองทางเลือกและผลกระทบต่อรายได้/กำไร/ลูกค้า/ทีม</li><li>เสนอ Decision พร้อม Owner, Timeline, Guardrail และ Review Date</li></ol><div class="formula">${escapeHtml(d[1])}</div><h3 style="margin-top:20px">เจาะลึกบทเรียนประจำสัปดาห์</h3><p>${escapeHtml(l.deepDive)}</p><h3>ตัวอย่างประยุกต์กับ IDO4IDEA</h3><p>${escapeHtml(l.appliedExample)}</p><p>หัวข้อฝึก: <strong>${escapeHtml(l.concept)}</strong> ให้ลองอธิบายแต่ละคำด้วยตัวอย่างจากธุรกิจที่คุณรับผิดชอบ หากยังไม่มีข้อมูลจริงให้เริ่มจาก Simulation แล้วทำเครื่องหมาย Assumption ชัดเจน</p></article><article class="panel"><div class="sub">03 · EXECUTIVE PITFALLS</div><h2>ข้อผิดพลาดที่ต้องระวัง</h2><div class="callout">${escapeHtml(d[2])}</div><ul><li>อย่าเทียบข้อมูลที่มีช่วงเวลาหรือคำนิยามไม่ตรงกัน</li><li>อย่าอ้างเหตุและผลจาก Correlation เพียงอย่างเดียว</li><li>อย่าคิดว่าผลลัพธ์หลังหักค่า Ads คือกำไรสุทธิ</li><li>บันทึกที่มาของข้อมูลและสิ่งที่ยังไม่ทราบไว้ทุกครั้ง</li></ul></article></div><div class="stack"><aside class="panel"><div class="sub">WEEKLY LEARNING OBJECTIVES</div><h3>เรียนจบบทนี้ต้องทำอะไรได้</h3><p>${escapeHtml(l.outcome)}</p><h3>ศัพท์ที่ต้องรู้</h3><div class="card-list">${l.concept.split(',').map(x=>`<div class="mini">${escapeHtml(x.trim())}</div>`).join('')}</div><button class="btn" onclick="tab='case';lesson()">ไป Case Study →</button></aside><aside class="panel"><h3>Checklist ก่อนจบบท</h3><label class="check"><input type="checkbox" ${state.done[l.id]?'checked':''} onchange="toggleDone(${l.id},this.checked)"> ทำ Quiz และ Workshop พร้อมสรุปสิ่งที่เรียนรู้แล้ว</label><p class="muted">สถานะจะถูกบันทึกอัตโนมัติในเบราว์เซอร์นี้</p></aside></div></div>`;if(tab==='case')body.innerHTML=`<div class="two"><article class="panel"><div class="sub">SIMULATED BUSINESS CASE · IDO4IDEA</div><h2>เคสจำลอง: ${escapeHtml(l.title)}</h2><p>สมมติว่าทีมการตลาดต้องตัดสินใจเรื่อง <b>${escapeHtml(l.concept)}</b> ภายใต้ทรัพยากรจำกัด โดยผู้บริหารต้องการคำตอบว่าควรดำเนินการต่อหรือไม่</p><div class="card-list"><div class="mini"><strong>โจทย์ปัจจุบัน</strong> มีข้อมูล Funnel และรายได้ แต่ยังต้องแยกต้นทุนจริง ความแม่นยำ และตัวแปรที่ Marketing ควบคุมไม่ได้</div><div class="mini"><strong>ตัวเลขฝึก (สมมติ)</strong> งบการตลาด 120,000 บาท • Lead 240 ราย • Qualified Rate 35% • Win Rate จาก Qualified 12% • Average Order Value 125,000 บาท</div><div class="mini"><strong>คำถาม</strong> ประมาณการจำนวนลูกค้า รายได้ และอธิบายความเสี่ยงของตัวเลข ควรลงทุนต่อหรือทดสอบแบบจำกัดวง?</div></div><h3 style="margin-top:20px">แนวทางวิเคราะห์</h3><ol><li>Qualified Leads = 240 × 35% = 84 ราย</li><li>Expected Wins = 84 × 12% = 10.08 ราย (ค่าเฉลี่ยคาดหมาย ไม่ใช่ยอดขายที่รับประกัน)</li><li>Expected Revenue = 10.08 × 125,000 = 1,260,000 บาท</li><li>ต้องตรวจสอบ Sales Cycle, Capacity, Cancellation และ Gross/Contribution Margin ก่อนสรุปคุ้มทุน</li></ol><div class="callout">คำถามต่อยอด: ถ้า Qualified Rate ลดเหลือ 20% การตัดสินใจจะเปลี่ยนหรือไม่? จงระบุข้อมูล 3 ชุดที่ต้องขอเพิ่มจาก Finance/Sales</div></article><aside class="panel"><h3>Executive Decision Template</h3><p><b>Recommendation:</b> สิ่งที่ควรทำ/ไม่ควรทำ</p><p><b>Evidence:</b> ข้อมูลสนับสนุนพร้อมที่มา</p><p><b>Alternatives:</b> ทางเลือก 2–3 แบบ</p><p><b>Economics:</b> ผลกระทบและความเสี่ยง</p><p><b>Next Review:</b> กำหนดวันทบทวน</p><button class="btn secondary" onclick="tab='workshop';lesson()">ทำ Workshop →</button></aside></div>`;if(tab==='workshop')body.innerHTML=`<div class="two"><article class="panel"><div class="sub">WEEK ${l.week} ASSIGNMENT</div><h2>${escapeHtml(l.assignment)}</h2><p><b>โจทย์:</b> สร้างผลลัพธ์ที่นำไปใช้จริงได้ในหัวข้อ ${escapeHtml(l.title)} โดยแยกข้อมูลจริง สมมติฐาน และคำถามค้างไว้อย่างชัดเจน</p><ol><li>อธิบาย Business Problem และ Why Now</li><li>กำหนด KPI สูตรและ Data Source</li><li>วิเคราะห์ทางเลือกอย่างน้อย 2 แบบ</li><li>เขียน Executive Recommendation ไม่เกิน 200 คำ</li><li>ระบุความเสี่ยง 3 ข้อ พร้อม Mitigation และ Owner</li></ol><label class="fieldlabel" for="work">พื้นที่ทำ Workshop / ส่ง Assignment</label><textarea id="work" placeholder="เขียนคำตอบ แนบลิงก์ Google Sheet หรือสรุปข้อค้นพบได้ที่นี่...">${escapeHtml(state.work[l.id]||'')}</textarea><div class="actionrow"><button class="btn" onclick="state.work[${l.id}]=$('work').value;save();toast('บันทึก Workshop แล้ว')">บันทึกงาน</button><button class="btn secondary" onclick="navigator.clipboard?.writeText($('work').value).then(()=>toast('คัดลอกแล้ว'))">คัดลอก</button></div></article><aside class="panel"><h3>เกณฑ์ตรวจงาน (Rubric)</h3><ul><li>นิยามโจทย์ได้ชัดเจน 20%</li><li>ข้อมูลและสูตรถูกต้อง 25%</li><li>วิเคราะห์ทางเลือกและความเสี่ยง 25%</li><li>ข้อเสนอเชิงบริหาร 20%</li><li>การสื่อสารกระชับ 10%</li></ul><div class="callout">คะแนน Workshop ต้องตรวจโดยผู้สอนหรือผู้ประเมิน ไม่ควรให้ระบบให้คะแนนอัตโนมัติจากการเขียนข้อความอย่างเดียว</div></aside></div>`;if(tab==='quiz')body.innerHTML=`<div class="two"><article class="panel"><div class="sub">KNOWLEDGE CHECK</div><h2>Mini Quiz สัปดาห์ ${l.week}</h2><p>${escapeHtml(l.question)}</p><label class="fieldlabel">คำตอบตัวเลข (${escapeHtml(l.unit)})</label><input type="number" id="quizAnswer" value="${state.quiz[l.id]?.input??''}" placeholder="กรอกคำตอบ"><div class="actionrow"><button class="btn" onclick="checkQuiz(${l.id})">ตรวจคำตอบ</button><button class="btn secondary" onclick="$('quizHint').textContent='แนวคิด: '+${JSON.stringify(d[1])}">ดูคำใบ้</button></div><div id="quizHint" class="muted" style="margin-top:12px"></div><div id="quizResult">${state.quiz[l.id]?`<div class="qresult">${state.quiz[l.id].correct?'✅ ตอบถูกต้อง':'🔁 ลองใหม่อีกครั้ง'} ${state.quiz[l.id].correct?'ค่าที่ถูกต้อง '+l.answer.toLocaleString('th-TH')+' '+escapeHtml(l.unit):''}</div>`:''}</div><h3 style="margin-top:24px">Reflection</h3><p>ถ้าใช้ข้อมูลนี้นำเสนอ CEO จะระบุข้อจำกัด ข้อมูลที่ยังขาด และ Next Action อย่างไร?</p><textarea id="reflection" placeholder="เขียนข้อคิดหลังเรียน...">${escapeHtml(state.notes[l.id]||'')}</textarea><div class="actionrow"><button class="btn secondary" onclick="state.notes[${l.id}]=$('reflection').value;save();toast('บันทึก Reflection แล้ว')">บันทึก Reflection</button><button class="btn" onclick="state.notes[${l.id}]=$('reflection').value;state.done[${l.id}]=true;save();render();toast('จบบทเรียนแล้ว')">ทำเครื่องหมายเรียนจบ ✓</button></div></article><aside class="panel"><h3>การประเมินผลที่แนะนำ</h3><p>Quiz นี้ตรวจความเข้าใจเรื่องการคำนวณเพียงหนึ่งข้อ ต่อบท ควรใช้ร่วมกับ Workshop และ Review ของผู้สอนเพื่อยืนยันทักษะ</p><div class="callout">ข้อควรระวัง: คำตอบเชิงตัวเลขไม่แทนความสามารถวิเคราะห์ธุรกิจ</div></aside></div>`}
function toggleDone(id,v){state.done[id]=v;save();renderNav($('search').value)}function checkQuiz(id){let l=LES[id-1],v=Number($('quizAnswer').value),valid=$('quizAnswer').value.trim()!=='';let correct=valid&&Math.abs(v-l.answer)<.001;state.quiz[id]={input:$('quizAnswer').value,correct};save();$('quizResult').innerHTML=`<div class="qresult">${correct?'✅ ถูกต้อง! คำตอบคือ '+l.answer.toLocaleString('th-TH')+' '+escapeHtml(l.unit):'ยังไม่ถูก ลองตรวจโจทย์ ตัวตั้ง/ตัวหาร และหน่วยอีกครั้ง'}</div>`}function toast(s){let d=document.createElement('div');d.textContent=s;d.style='position:fixed;bottom:25px;right:25px;background:#173b75;color:white;padding:13px 18px;border-radius:10px;z-index:100';document.body.append(d);setTimeout(()=>d.remove(),2200)}function exportProgress(){let out={exported:new Date().toISOString(),academy:'CMO Executive Academy',...state};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download='CMO_Academy_Progress.json';a.click();URL.revokeObjectURL(a.href)}$('search').addEventListener('input',()=>renderNav($('search').value));render();</script></body></html>
